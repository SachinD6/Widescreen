<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#111;color:#eee;font:28px system-ui}
body{display:flex;align-items:center;justify-content:center;gap:24px}
input{width:64px;height:64px}</style>
<label><input type="checkbox" id="cb"></label><div id="out">unchecked</div>
<script>var cb=document.getElementById('cb'),o=document.getElementById('out');
cb.addEventListener('change',function(){o.textContent=cb.checked?'CHECKED':'unchecked'});</script>
